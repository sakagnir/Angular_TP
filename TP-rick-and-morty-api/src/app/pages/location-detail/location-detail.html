<div class="location-detail">
    <h2>{{ location()?.name }}</h2>
    <p>Dimension: {{ location()?.dimension}}</p>
    <p>Type: {{ location()?.type}}</p>
    <h4 for="ul">Personnage Lié</h4>
    <div class="grille">
        @for (r of residents(); track r.id) {
            <article>
                <h3>{{ r.name }}</h3>
                <a routerLink="/characters/{{ r.id }}"><img src="{{ r.image}}" alt="character_picture"></a>
                <p>{{ r.status }}</p>
            </article>
        }
    </div>
</div>
